<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root {
  /* Color roles. Seed #2A835F. Palette: #092328 #12544F #2A835F #8BBB92 (dark scheme) */
  --bg: #092328;
  --layer-back: #12544F;
  --layer-mid: #2A835F;
  --hero: #8BBB92;
  --on-hero: #092328;
  --surface-container: #0C3436;
  --surface-container-high: #0F3C3D;
  --on-surface: #DCEFE0;
  --on-surface-variant: #8BBB92;
  --primary: #8BBB92;
  --on-primary: #092328;
  --secondary-container: #12544F;
  --on-secondary-container: #DCEFE0;
  --focus: #8BBB92;
  --elevation-3: 0 1px 3px rgba(0,0,0,.30), 0 4px 8px 3px rgba(0,0,0,.15);

  /* Shape (M3 corner scale) */
  --shape-inner: 8px;
  --shape-chip: 8px;
  --shape-press: 12px;
  --shape-selected: 16px;
  --shape-xl: 28px;
  --shape-full: 999px;

  /* Spacing (4dp grid) */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --sp-7: 48px;

  /* Size */
  --target: 56px;
  --stage: min(74vw, 54dvh, 480px);

  /* Type */
  --font: "Roboto Flex", system-ui, sans-serif;

  /* --motion-* tokens are generated by JS from spring() */
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #F2FBF4;
    --layer-back: #CDE8D1;
    --layer-mid: #8BBB92;
    --hero: #12544F;
    --on-hero: #F2FBF4;
    --surface-container: #E1EEE4;
    --surface-container-high: #D4E6D8;
    --on-surface: #092328;
    --on-surface-variant: #2E4F4A;
    --primary: #12544F;
    --on-primary: #F2FBF4;
    --secondary-container: #BFDCC4;
    --on-secondary-container: #092328;
    --focus: #12544F;
    --elevation-3: 0 1px 3px rgba(9,35,40,.22), 0 4px 8px 3px rgba(9,35,40,.12);
  }
}
@media (min-width: 600px) { :root { --stage: min(66vw, 58dvh, 560px); } }
@media (min-width: 840px) { :root { --stage: min(52vw, 62dvh, 640px); } }

/* ============ BASE ============ */
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--on-surface);
  font-family: var(--font);
  overflow: hidden;
}
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
#p-back { fill: var(--layer-back); }
#p-mid  { fill: var(--layer-mid); }

main {
  position: relative; z-index: 1;
  min-height: 100dvh;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: var(--sp-6);
  padding: var(--sp-4) var(--sp-4) 112px;
}

.label-md { font-size: 12px; line-height: 16px; letter-spacing: .5px; font-variation-settings: "wght" 560, "wdth" 100; }
.label-lg { font-size: 14px; line-height: 20px; letter-spacing: .1px; font-variation-settings: "wght" 650, "wdth" 100; }

.chip {
  display: inline-flex; align-items: center; height: 32px;
  padding: 0 var(--sp-3);
  border-radius: var(--shape-chip);
  background: var(--surface-container);
  color: var(--on-surface-variant);
}

/* ============ HERO ============ */
.stage {
  position: relative; width: var(--stage); aspect-ratio: 1; container-type: inline-size;
  cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
.stage-inner { position: absolute; inset: 0; }
.hero-shape { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
#p-hero { fill: var(--hero); }

/* seconds ring: 1 unit = stage/200, so r=100 is the hero edge */
.ring {
  position: absolute; left: -9%; top: -9%; width: 118%; height: 118%; overflow: visible;
  transform-origin: 50% 50%;
  transition:
    opacity var(--motion-effects-default-dur) var(--motion-effects-default),
    transform var(--motion-spatial-slow-dur) var(--motion-spatial-slow);
}
.tick {
  stroke: var(--on-surface); stroke-opacity: .3; stroke-width: 2; stroke-linecap: round;
  transition:
    stroke var(--motion-effects-default-dur) var(--motion-effects-default),
    stroke-opacity var(--motion-effects-default-dur) var(--motion-effects-default);
}
.tick.major { stroke-width: 2.8; }
.tick.on { stroke: var(--hero); stroke-opacity: 1; }
#dot { fill: var(--on-surface); }

.face {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 1.4cqw;
  color: var(--on-hero);
  text-align: center;
}
.weekday { font-size: max(13px, 5cqw); line-height: 1.2; font-variation-settings: "wght" 650, "wdth" 100, "opsz" 24; letter-spacing: .01em; }
.date    { font-size: max(12px, 4.2cqw); line-height: 1.2; font-variation-settings: "wght" 420, "wdth" 100, "opsz" 14; letter-spacing: .02em; }
.time {
  display: block;
  font-size: 23cqw; line-height: .95;
  font-variation-settings: "wght" 820, "wdth" 105, "opsz" 144, "GRAD" 0;
  font-feature-settings: "tnum" 1;
  letter-spacing: -.025em;
  white-space: nowrap;
}
.d { display: inline-block; position: relative; }
.d[hidden] { display: none; }
.ghost { position: absolute; left: 0; top: 0; pointer-events: none; }
.colon { display: inline-block; width: .3em; text-align: center; transform: translateY(-.06em); }

/* seconds pill, collapses when seconds are off */
.sec-wrap {
  display: grid; grid-template-rows: 1fr;
  transition: grid-template-rows var(--motion-spatial-default-dur) var(--motion-spatial-default);
}
.sec-inner { overflow: hidden; min-height: 0; display: flex; justify-content: center; }
.pill {
  margin: 3px 0;
  height: 9cqw; min-width: 18cqw; padding: 0 3.6cqw;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 4.5cqw;
  background: var(--on-hero); color: var(--hero);
  font-size: 6.4cqw; line-height: 1;
  font-variation-settings: "wght" 700, "wdth" 108, "opsz" 48;
  font-feature-settings: "tnum" 1; letter-spacing: .02em;
  transition:
    opacity var(--motion-effects-default-dur) var(--motion-effects-default),
    transform var(--motion-spatial-default-dur) var(--motion-spatial-default);
}
body.no-sec .sec-wrap { grid-template-rows: 0fr; }
body.no-sec .pill { opacity: 0; transform: scale(.8); }
body.no-sec .ring { opacity: 0; transform: scale(.88); }

.wave { width: 42cqw; height: 5cqw; overflow: visible; margin: .6cqw 0; }
.wave path { fill: none; stroke: currentColor; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.wave .track { opacity: .28; }

/* ============ FLOATING TOOLBAR + M3E BUTTONS ============ */
.toolbar {
  position: fixed; z-index: 2;
  left: 50%; bottom: max(var(--sp-5), env(safe-area-inset-bottom));
  transform: translateX(-50%);
  display: flex; align-items: center; gap: var(--sp-2);
  padding: var(--sp-2);
  border-radius: var(--shape-full);
  background: var(--surface-container);
  box-shadow: var(--elevation-3);
}
.group { display: flex; gap: 2px; }

.seg, .icon-btn {
  position: relative; isolation: isolate;
  height: var(--target);
  border: 0; cursor: pointer;
  font-family: var(--font);
  display: inline-flex; align-items: center; justify-content: center;
  transition:
    border-radius var(--motion-spatial-default-dur) var(--motion-spatial-default),
    transform var(--motion-spatial-default-dur) var(--motion-spatial-default),
    background-color var(--motion-effects-default-dur) var(--motion-effects-default),
    color var(--motion-effects-default-dur) var(--motion-effects-default);
}
/* state layers: 8% hover, 10% focus, 10% pressed (of on-color) */
.seg::after, .icon-btn::after {
  content: ""; position: absolute; inset: 0; z-index: -1;
  border-radius: inherit; background: currentColor; opacity: 0; pointer-events: none;
  transition: opacity var(--motion-effects-fast-dur) var(--motion-effects-fast);
}
@media (hover: hover) {
  .seg:hover::after, .icon-btn:hover::after { opacity: .08; }
}
.seg:focus-visible::after, .icon-btn:focus-visible::after { opacity: .10; }
.seg:active::after, .icon-btn:active::after { opacity: .10; }
.seg:focus-visible, .icon-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.seg {
  min-width: 88px; padding: 0 var(--sp-5);
  background: var(--surface-container-high);
  color: var(--on-surface-variant);
  border-radius: var(--r-unselected);
}
.seg:first-child { --r-unselected: var(--shape-xl) var(--shape-inner) var(--shape-inner) var(--shape-xl); }
.seg:last-child  { --r-unselected: var(--shape-inner) var(--shape-xl) var(--shape-xl) var(--shape-inner); }
.seg[aria-checked="true"] { background: var(--primary); color: var(--on-primary); border-radius: var(--shape-xl); }
.seg:active { border-radius: var(--shape-press); transform: scale(.96); }

.icon-btn {
  width: var(--target);
  border-radius: var(--shape-xl);
  background: var(--secondary-container);
  color: var(--on-secondary-container);
}
.icon-btn svg { width: 24px; height: 24px; fill: currentColor; }
.icon-btn.toggle[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-radius: var(--shape-selected); }
.icon-btn:active, .icon-btn.toggle[aria-pressed="true"]:active { border-radius: var(--shape-press); transform: scale(.96); }
</style>
</head>
<body>

<svg id="bg" aria-hidden="true"><path id="p-back"/><path id="p-mid"/></svg>

<main>
  <p class="chip label-md" id="meta"></p>
  <section class="stage" id="stage" aria-label="Current time">
    <div class="stage-inner" id="inner">
      <svg class="hero-shape" viewBox="-100 -100 200 200" aria-hidden="true"><path id="p-hero"/></svg>
      <svg class="ring" viewBox="-118 -118 236 236" aria-hidden="true"><g id="ticks"></g><circle id="dot" r="3.2"/></svg>
      <div class="face">
        <p class="weekday" id="weekday"></p>
        <time class="time" id="clock" role="img">
          <span class="d"></span><span class="d"></span><span class="colon" id="colon" aria-hidden="true">:</span><span class="d"></span><span class="d"></span>
        </time>
        <div class="sec-wrap"><div class="sec-inner">
          <span class="pill" id="pill" aria-hidden="true"><span class="d"></span><span class="d"></span></span>
        </div></div>
        <svg class="wave" viewBox="0 0 100 12" aria-hidden="true">
          <path class="track" d="M0 6H100"/>
          <path id="w-active"/>
        </svg>
        <p class="date" id="date"></p>
      </div>
    </div>
  </section>
</main>

<div class="toolbar" id="toolbar" role="toolbar" aria-label="Clock options">
  <div class="group" role="radiogroup" aria-label="Time format" id="group">
    <button class="seg label-lg" role="radio" aria-checked="true"  data-fmt="24">24-hour</button>
    <button class="seg label-lg" role="radio" aria-checked="false" data-fmt="12" tabindex="-1">12-hour</button>
  </div>
  <button class="icon-btn toggle" id="secBtn" aria-pressed="true" aria-label="Show seconds">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 1H9v2h6V1zm-4 13h2V8h-2v6zm8.03-6.61 1.42-1.42c-.43-.51-.9-.99-1.41-1.41l-1.42 1.42A8.962 8.962 0 0 0 12 4c-4.97 0-9 4.03-9 9s4.02 9 9 9 9-4.03 9-9c0-2.12-.74-4.07-1.97-5.61zM12 20c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
  </button>
  <button class="icon-btn" id="shuffle" aria-label="Change shapes">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
  </button>
</div>

<script>
/* ============ SPRING UTIL (CSS linear() generator) ============ */
// Damped spring (mass 1) -> CSS linear() easing + settle duration (ms).
function spring(stiffness, damping, samples = 48) {
  const w0 = Math.sqrt(stiffness);
  const z = damping;
  const settle = 6.9 / (z * w0);
  const wd = z < 1 ? w0 * Math.sqrt(1 - z * z) : 0;
  const x = (t) =>
    z < 1
      ? Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t))
      : Math.exp(-w0 * t) * (1 + w0 * t);
  const pts = Array.from({ length: samples + 1 }, (_, i) =>
    +(1 - x((i / samples) * settle)).toFixed(4));
  pts[samples] = 1;
  return { duration: Math.round(settle * 1000), easing: `linear(${pts.join(", ")})` };
}

/* ============ MOTION TOKENS ============ */
const SPRINGS = {
  spatial: { fast: [800, 0.6],  default: [380, 0.8],  slow: [200, 0.8] },
  effects: { fast: [3800, 1.0], default: [1600, 1.0], slow: [800, 1.0] },
};
const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
const T = {};
function buildMotionTokens() {
  const root = document.documentElement.style;
  for (const fam in SPRINGS) for (const speed in SPRINGS[fam]) {
    let s = spring(...SPRINGS[fam][speed]);
    if (reduceMQ.matches) s = fam === 'spatial' ? { easing: 'linear', duration: 1 } : { easing: 'linear', duration: 120 };
    T[fam + '-' + speed] = s;
    root.setProperty(`--motion-${fam}-${speed}`, s.easing);
    root.setProperty(`--motion-${fam}-${speed}-dur`, s.duration + 'ms');
  }
}
buildMotionTokens();
reduceMQ.addEventListener('change', buildMotionTokens);

// WAAPI helper. Spatial runs are skipped under reduced motion, effects become a short linear fade.
function run(el, keyframes, fam, speed = 'fast') {
  if (fam === 'spatial' && reduceMQ.matches) return null;
  const t = T[fam + '-' + speed];
  return el.animate(keyframes, { duration: t.duration, easing: t.easing });
}

const $ = id => document.getElementById(id);
const f = v => v.toFixed(2);
const N = 120, TAU = Math.PI * 2;

/* ============ SPRING SOLVERS (retargetable, keep velocity) ============ */
class Spring {
  constructor([k, z], x = 0, t = x) { this.k = k; this.c = 2 * z * Math.sqrt(k); this.x = x; this.t = t; this.v = 0; }
  step(h) {
    if (reduceMQ.matches) { this.x = this.t; this.v = 0; return; }
    this.v += (-this.k * (this.x - this.t) - this.c * this.v) * h;
    this.x += this.v * h;
  }
  kick(v) { if (!reduceMQ.matches) this.v += v; }
}

/* ============ SHAPES (polar radius functions, equal point count) ============ */
const SHAPE_FN = {
  circle:   () => 1,
  cookie:   a => .9 + .1 * Math.cos(9 * a),
  clover:   a => .76 + .24 * Math.cos(4 * a),
  burst:    a => 1 - .16 * Math.pow(Math.abs(Math.sin(6 * a)), .85),
  flower:   a => .8 + .2 * Math.cos(5 * a),
  squircle: a => 1 / Math.pow(Math.pow(Math.abs(Math.cos(a)), 4) + Math.pow(Math.abs(Math.sin(a)), 4), .25),
  oval:     a => { const b = .72; return b / Math.hypot(b * Math.cos(a), Math.sin(a)); },
  pebble:   a => .92 + .08 * Math.cos(2 * a) + .04 * Math.cos(3 * a + 1),
};
const BG_SHAPES   = ['circle', 'cookie', 'clover', 'burst', 'flower', 'squircle', 'oval', 'pebble'];
const HERO_SHAPES = ['circle', 'cookie', 'squircle', 'burst', 'pebble']; // min radius >= .8 so the time always fits
const SHAPES = {};
for (const name of BG_SHAPES) {
  const r = Array.from({ length: N }, (_, i) => SHAPE_FN[name](i / N * TAU));
  const max = Math.max(...r);
  SHAPES[name] = Float32Array.from(r, v => v / max);
}

// Per-point radius spring + rotation spring. Shape morph = every radius springs to the next shape.
class Morph {
  constructor(params) {
    this.k = params[0]; this.c = 2 * params[1] * Math.sqrt(params[0]);
    this.pos = Float32Array.from(SHAPES.circle);
    this.vel = new Float32Array(N);
    this.tgt = Float32Array.from(SHAPES.circle);
    this.rot = 0; this.rotV = 0; this.rotT = 0;
  }
  to(name) { this.tgt.set(SHAPES[name]); }
  spin(deg) { this.rotT += deg; }
  step(h) {
    if (reduceMQ.matches) { this.pos.set(this.tgt); this.vel.fill(0); this.rot = this.rotT; this.rotV = 0; return; }
    const { k, c, pos, vel, tgt } = this;
    for (let i = 0; i < N; i++) {
      vel[i] += (-k * (pos[i] - tgt[i]) - c * vel[i]) * h;
      pos[i] += vel[i] * h;
    }
    this.rotV += (-k * (this.rot - this.rotT) - c * this.rotV) * h;
    this.rot += this.rotV * h;
  }
}
function shapePath(pos, cx, cy, R) {
  const P = new Array(N);
  for (let i = 0; i < N; i++) {
    const a = i / N * TAU;
    P[i] = [cx + Math.cos(a) * pos[i] * R, cy + Math.sin(a) * pos[i] * R];
  }
  let d = `M${f(P[0][0])} ${f(P[0][1])}`;
  for (let i = 0; i < N; i++) { // closed Catmull-Rom -> cubic bezier
    const p0 = P[(i - 1 + N) % N], p1 = P[i], p2 = P[(i + 1) % N], p3 = P[(i + 2) % N];
    d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ` +
         `${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
  }
  return d + 'Z';
}

/* ============ STATE ============ */
const bg = $('bg'), pBack = $('p-back'), pMid = $('p-mid'), pHero = $('p-hero');
const stage = $('stage'), inner = $('inner'), clock = $('clock'), colon = $('colon');
const pill = $('pill'), wActive = $('w-active'), dot = $('dot');
const segs = [...document.querySelectorAll('.seg')];

const back = new Morph(SPRINGS.spatial.slow);
const mid  = new Morph(SPRINGS.spatial.default);
const hero = new Morph(SPRINGS.spatial.default);
const hsIn    = new Spring(SPRINGS.spatial.slow, 0, 1);   // entrance / seconds-toggle scale
const hsPulse = new Spring(SPRINGS.spatial.fast, 1, 1);   // press squish + per-second pulse
const dotP    = new Spring(SPRINGS.spatial.fast, 0, 0);   // dot swell on each second
const amp     = new Spring(SPRINGS.spatial.default, 0, 2.2);
const pxB = new Spring(SPRINGS.spatial.slow), pyB = new Spring(SPRINGS.spatial.slow);
const pxM = new Spring(SPRINGS.spatial.slow), pyM = new Spring(SPRINGS.spatial.slow);
const pxH = new Spring(SPRINGS.spatial.slow), pyH = new Spring(SPRINGS.spatial.slow);
const par = [pxB, pyB, pxM, pyM, pxH, pyH];

const WAVE_AMP = 2.2, WAVE_LEN = 10, WAVE_W = 100, HERO_R = 96, WAVE_PHASE_RATE = 3;
let fmt = 24, secOn = true, offset = 0, lastMinute = -1, lastSec = -1, lastKey = '', phase = 0;
let cx = 0, cy = 0, S = 0;

/* ============ DIGIT SLOTS (roll in, old digit rolls out) ============ */
document.querySelectorAll('.d').forEach(el => el.appendChild(Object.assign(document.createElement('span'), { className: 'v' })));
const digits = [...clock.querySelectorAll('.d')];
const secDigits = [...pill.querySelectorAll('.d')];

function setDigit(slot, ch, animate) {
  if (slot.dataset.c === ch) return;
  const old = slot.dataset.c;
  slot.dataset.c = ch;
  const v = slot.firstChild;
  v.textContent = ch;
  slot.hidden = ch === '';
  if (!animate || ch === '') return;
  run(v, [{ transform: 'translateY(.3em)' }, { transform: 'translateY(0)' }], 'spatial');
  run(v, [{ opacity: 0 }, { opacity: 1 }], 'effects');
  if (old) {
    const g = document.createElement('span');
    g.className = 'ghost'; g.textContent = old;
    slot.appendChild(g);
    run(g, [{ transform: 'translateY(0)' }, { transform: 'translateY(-.3em)' }], 'spatial');
    const a = run(g, [{ opacity: 1 }, { opacity: 0 }], 'effects');
    a.onfinish = () => g.remove();
  }
}

/* ============ SECONDS RING ============ */
const NS = 'http://www.w3.org/2000/svg';
const R1 = 106, R_DOT = 101;
const ticks = Array.from({ length: 60 }, (_, i) => {
  const a = i / 60 * TAU - Math.PI / 2, c = Math.cos(a), s = Math.sin(a);
  const el = document.createElementNS(NS, 'line');
  el.setAttribute('class', 'tick' + (i % 5 === 0 ? ' major' : ''));
  el.setAttribute('x1', f(c * R1)); el.setAttribute('y1', f(s * R1));
  $('ticks').appendChild(el);
  return { el, c, s, base: i % 5 === 0 ? 4.5 : 2.5, sp: new Spring(SPRINGS.spatial.fast) };
});
// staggered ripple around the ring (M3E stagger, ~10ms per tick)
function ripple() {
  if (reduceMQ.matches) return;
  ticks.forEach((tk, i) => setTimeout(() => tk.sp.kick(10), i * 10));
}

/* ============ SHAPE TARGETS ============ */
function retarget(rotBump) {
  const m = lastMinute;
  back.to(BG_SHAPES[(m * 3 + offset + 1) % BG_SHAPES.length]); back.spin(rotBump * .7);
  mid.to(BG_SHAPES[(m * 5 + offset + 2) % BG_SHAPES.length]);  mid.spin(-rotBump);
  hero.to(HERO_SHAPES[(m + offset) % HERO_SHAPES.length]);
}

function measure() {
  bg.setAttribute('viewBox', `0 0 ${innerWidth} ${innerHeight}`);
  const r = stage.getBoundingClientRect(); // stage itself never transforms; stage-inner does
  cx = r.left + r.width / 2; cy = r.top + r.height / 2; S = r.width;
}
new ResizeObserver(measure).observe(stage);
addEventListener('resize', measure);
measure();

/* ============ TIME RENDER ============ */
function renderTime(d, animate) {
  let h = d.getHours(); const m = d.getMinutes();
  let ap = '';
  if (fmt === 12) { ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; }
  const hs = fmt === 24 ? String(h).padStart(2, '0') : String(h);
  const ms = String(m).padStart(2, '0');
  [hs.length === 2 ? hs[0] : '', hs[hs.length - 1], ms[0], ms[1]].forEach((ch, i) => setDigit(digits[i], ch, animate));
  clock.setAttribute('aria-label', `${hs}:${ms}${ap ? ' ' + ap : ''}`);
  $('weekday').textContent = d.toLocaleDateString('en-GB', { weekday: 'long' }) + (ap ? ' · ' + ap : '');
  $('date').textContent = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
}
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7));
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return Math.ceil(((t - y0) / 864e5 + 1) / 7);
}
function renderMeta(d) {
  const off = -d.getTimezoneOffset(), sign = off < 0 ? '−' : '+', a = Math.abs(off);
  const hh = Math.floor(a / 60), mm = a % 60;
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone.replace(/_/g, ' ');
  $('meta').textContent = `${tz} · UTC${sign}${hh}${mm ? ':' + String(mm).padStart(2, '0') : ''} · Week ${isoWeek(d)}`;
}

/* ============ PER-SECOND EVENT ============ */
function onSecond(s, animate) {
  const ss = String(s).padStart(2, '0');
  setDigit(secDigits[0], ss[0], animate);
  setDigit(secDigits[1], ss[1], animate);
  ticks.forEach((tk, i) => { tk.sp.t = i === s ? 1 : 0; tk.el.classList.toggle('on', i <= s); });
  back.spin(-2);   // mechanical second-hand feel: each layer steps and settles with overshoot
  mid.spin(3);
  if (!animate) return;
  dotP.kick(18);
  hsPulse.kick(.6);
  run(colon, [{ transform: 'translateY(-.06em) scale(1.3)' }, { transform: 'translateY(-.06em) scale(1)' }], 'spatial');
  if (secOn) run(pill, [
    { borderRadius: '2cqw', transform: 'scale(.93)' },
    { borderRadius: '4.5cqw', transform: 'scale(1)' },
  ], 'spatial');
}

/* ============ WAVY PROGRESS (progress through the hour) ============ */
function wavePath(L, A, ph) {
  if (L < .5) return '';
  let s = '';
  for (let x = 0; x < L; x += 1) s += (x ? 'L' : 'M') + x + ' ' + f(6 + A * Math.sin(x / WAVE_LEN * TAU - ph));
  return s + 'L' + f(L) + ' ' + f(6 + A * Math.sin(L / WAVE_LEN * TAU - ph));
}

/* ============ FRAME LOOP ============ */
let last = performance.now(), first = true;
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30); last = now;
  const d = new Date();
  const sec = d.getSeconds(), min = d.getMinutes(), ms = d.getMilliseconds();

  const key = fmt + '|' + d.getHours() + ':' + min + '|' + d.getDate();
  if (key !== lastKey) { renderTime(d, !first); renderMeta(d); lastKey = key; }
  if (min !== lastMinute) { lastMinute = min; retarget(first ? 0 : 28); if (!first) ripple(); }
  if (sec !== lastSec) { lastSec = sec; onSecond(sec, !first); }
  if (first) { ripple(); first = false; }

  amp.t = (min === 59 && sec === 59) ? 0 : WAVE_AMP; // flatten on the last second of the hour

  const sub = 4, h = dt / sub;
  for (let i = 0; i < sub; i++) {
    back.step(h); mid.step(h); hero.step(h);
    hsIn.step(h); hsPulse.step(h); dotP.step(h); amp.step(h);
    for (const p of par) p.step(h);
    for (const tk of ticks) tk.sp.step(h);
  }
  if (!reduceMQ.matches) phase += dt * WAVE_PHASE_RATE;

  // background layers, parallax in opposite directions for depth
  const bx = cx - .20 * S - .035 * S * pxB.x, by = cy + .14 * S - .035 * S * pyB.x;
  const mx = cx + .10 * S + .05 * S * pxM.x,  my = cy - .08 * S + .05 * S * pyM.x;
  pBack.setAttribute('d', shapePath(back.pos, bx, by, 1.00 * S));
  pBack.setAttribute('transform', `rotate(${f(back.rot)} ${f(bx)} ${f(by)})`);
  pMid.setAttribute('d', shapePath(mid.pos, mx, my, .72 * S));
  pMid.setAttribute('transform', `rotate(${f(mid.rot)} ${f(mx)} ${f(my)})`);

  // hero: shape morph, parallax, scale (entrance * press/second pulse)
  pHero.setAttribute('d', shapePath(hero.pos, 0, 0, HERO_R));
  inner.style.transform = `translate(${f(.02 * S * pxH.x)}px, ${f(.02 * S * pyH.x)}px) scale(${(hsIn.x * hsPulse.x).toFixed(4)})`;

  // seconds ring
  for (const tk of ticks) {
    const len = R1 + tk.base + Math.max(-.8, tk.sp.x) * 6;
    tk.el.setAttribute('x2', f(tk.c * len)); tk.el.setAttribute('y2', f(tk.s * len));
  }
  const ang = (sec + ms / 1000) / 60 * TAU - Math.PI / 2;
  dot.setAttribute('cx', f(Math.cos(ang) * R_DOT)); dot.setAttribute('cy', f(Math.sin(ang) * R_DOT));
  dot.setAttribute('r', f(Math.max(1.5, 3.2 + dotP.x * 5)));

  const prog = (min + (sec + ms / 1000) / 60) / 60;
  wActive.setAttribute('d', wavePath(prog * WAVE_W, Math.max(0, amp.x), phase));

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ============ ENTRANCE ============ */
hsIn.x = 0; hsIn.t = 1;
run($('toolbar'), [{ transform: 'translateX(-50%) translateY(140%)' }, { transform: 'translateX(-50%) translateY(0)' }], 'spatial', 'default');
run($('toolbar'), [{ opacity: 0 }, { opacity: 1 }], 'effects', 'default');
run($('meta'), [{ opacity: 0 }, { opacity: 1 }], 'effects', 'slow');

/* ============ INPUT ============ */
function aim(e) {
  if (reduceMQ.matches) return;
  const nx = (e.clientX / innerWidth - .5) * 2, ny = (e.clientY / innerHeight - .5) * 2;
  for (let i = 0; i < par.length; i += 2) { par[i].t = nx; par[i + 1].t = ny; }
}
function rest() { for (const p of par) p.t = 0; }
addEventListener('pointermove', aim);
addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') rest(); });
document.documentElement.addEventListener('mouseleave', rest);

// press the hero: squish on down, spring back + new shape on release
let pressing = false;
stage.addEventListener('pointerdown', () => { pressing = true; hsPulse.t = .955; });
stage.addEventListener('pointerup', () => { if (!pressing) return; pressing = false; hsPulse.t = 1; offset++; retarget(18); });
['pointercancel', 'pointerleave'].forEach(ev => stage.addEventListener(ev, () => { pressing = false; hsPulse.t = 1; }));

function select(btn) {
  segs.forEach(s => { const on = s === btn; s.setAttribute('aria-checked', on); s.tabIndex = on ? 0 : -1; });
  fmt = +btn.dataset.fmt;
  lastKey = ''; // force re-render
}
segs.forEach(s => s.addEventListener('click', () => select(s)));
$('group').addEventListener('keydown', e => {
  if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) return;
  e.preventDefault();
  const next = segs[(segs.indexOf(document.activeElement) + 1) % segs.length];
  next.focus(); select(next);
});
$('secBtn').addEventListener('click', e => {
  secOn = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  e.currentTarget.setAttribute('aria-pressed', secOn);
  document.body.classList.toggle('no-sec', !secOn);
  if (secOn) { ripple(); hsPulse.kick(.8); }
});
$('shuffle').addEventListener('click', () => { offset++; retarget(40); hsPulse.kick(1); });
</script>
</body>
</html>
